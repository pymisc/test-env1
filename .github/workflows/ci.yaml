name: Producer CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check environment
        run: |
          python3 --version
          aws --version

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            )

            console.log("aud =", payload.aud)
            console.log("sub =", payload.sub)
            console.log("repository =", payload.repository)
            console.log("repository_id =", payload.repository_id)
            console.log("repository_owner =", payload.repository_owner)
            console.log("repository_owner_id =", payload.repository_owner_id)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::389821258260:role/test-env1-producer
          aws-region: us-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run producer
        run: python3 producer.py